<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Admin | Modas Maldonado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fffafb, #f8e4e7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a3a3d;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border: 1px solid #f0dfe2;
      border-radius: 26px;
      padding: 34px 28px;
      box-shadow: 0 18px 40px rgba(111, 61, 70, 0.12);
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      color: #6f3d46;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      text-align: center;
      color: #7a676b;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    label {
      font-weight: 600;
      color: #6f3d46;
    }

    input {
      width: 100%;
      border: 1px solid #e4d7da;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.96rem;
      outline: none;
    }

    input:focus {
      border-color: #d9828a;
      box-shadow: 0 0 0 4px rgba(217, 130, 138, 0.16);
    }

    button {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #d9828a, #c86d77);
      color: white;
      padding: 15px 18px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
      min-height: 22px;
      color: #b14f63;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Acceso Admin</h1>
    <p>Ingresa con las credenciales autorizadas para gestionar el catálogo.</p>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="email">Correo admin</label>
        <input type="email" id="email" placeholder="admin@modasmaldonado.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="********" required>
      </div>

      <button type="submit">Ingresar</button>
      <p class="message" id="login-message"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("admin-login-form");
    const message = document.getElementById("login-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.error || "No se pudo iniciar sesión.";
          return;
        }

        window.location.href = "/admin";
      } catch (error) {
        message.textContent = "Error al conectar con el servidor.";
      }
    });
  </script>
</body>
</html>
